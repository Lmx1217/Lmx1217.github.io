    <div class="row first tall-media">
      <header class="label">
        <span class="tag">01</span>
        <h1>Machine Vision Strawberry Sorter</h1>
        <p class="summary">A conveyor that sorts strawberries by ripeness. A camera module checks how red each berry is, and a servo-driven flap pushes it into the right chute.</p>
      </header>
      <div class="media">
        <video class="vertical" src="videos/strawberry-run.mp4" poster="images/strawberry/run-poster.jpg" width="720" height="1280" autoplay muted loop playsinline controls preload="auto" aria-label="The sorter running: test strawberries ride the belt under the camera and get pushed into chutes."></video>
      </div>
    </div>

    <figure class="row">
      <div class="media"><img src="images/strawberry/machine.jpg" width="1400" height="1050" alt="The sorter on a workbench, seen from above: blue belt, camera module with touchscreen, servo flap, two black chutes, and the stepper motor."></div>
      <figcaption class="label">
        <span class="tag">The machine</span>
        A 495 mm aluminum frame holds a PU belt, driven by a stepper motor through a 30:1 gearbox. The K230 camera module sits on a printed gantry above the belt with the servo and flap under it, and a chute on each side catches the sorted berries. Its touchscreen handles calibration, settings, and the run screen, so no laptop is needed.
      </figcaption>
    </figure>

    <figure class="row">
      <div class="media"><img src="images/strawberry/machine-closeup.jpg" width="1400" height="1050" alt="Close-up of the sorting end: the K230 module with its screen, the servo and black flap over the belt, and the stepper motor with the driver board beside it."></div>
      <figcaption class="label">
        <span class="tag">How it works</span>
        The K230 and its screen on top, the servo and the flap that pushes berries off the belt, and the stepper motor at the far end. The camera picks out each berry by color, using yellow, green, and red ranges, and measures how much of it is red. It averages several frames, then decides at a trigger line. The belt doesn't have to stop for each push: the program works out when the berry will reach the flap, queues the push, and keeps watching for the next one. The cutoffs can be changed on the touchscreen.
      </figcaption>
    </figure>

    <figure class="row">
      <div class="media"><img src="images/strawberry/test-strawberries.jpg" width="1400" height="583" alt="Six 3D-printed test strawberries in a row, from fully red to white."></div>
      <figcaption class="label">
        <span class="tag">Test strawberries</span>
        I 3D printed these test strawberries. They run from fully red to white, so all three grades show up, and they're the berries in the video.
      </figcaption>
    </figure>

    <figure class="row">
      <div class="media stack">
        <img src="images/strawberry/model-exploded.png" width="1165" height="639" alt="Exploded view of the SketchUp model: belt, pulleys, brackets, camera case, servo mount, flap, chute, and motor.">
        <img src="images/strawberry/parts-laid-out.jpg" width="1400" height="1050" alt="The real parts laid out on a cutting mat: chutes, servo, flap, camera case and module, adapter board, aluminum frame, belt, blue printed brackets with bearings, stepper motor, and test strawberries.">
      </div>
      <figcaption class="label">
        <span class="tag">Pulled apart</span>
        The SketchUp model pulled apart (top) and the real parts (bottom). The pulleys, shafts, brackets, and camera gantry are printed in PETG, the camera case and flap in flexible TPU, and the pulleys turn on 608 bearings.
      </figcaption>
    </figure>

    <figure class="row">
      <div class="media stack">
        <img class="schematic" src="images/strawberry/adapter-board-schematic.png" width="722" height="421" alt="Schematic of the adapter board connecting the K230 pins to the servo, the A4988 stepper driver, and a boost converter.">
        <img src="images/strawberry/adapter-board.jpg" width="1400" height="1050" alt="The hand-soldered adapter board with the A4988 driver, mounted beside the stepper motor.">
      </div>
      <figcaption class="label">
        <span class="tag">Wiring</span>
        The schematic (top) and the real board beside the motor (bottom). This adapter board, soldered by hand, connects the K230 to the A4988 stepper driver and the MG995 servo. Power comes in at 5 V: one boost board makes 12 V for the motor, and the servo gets its own 5 V supply so its current spikes can't reset the main board.
      </figcaption>
    </figure>
